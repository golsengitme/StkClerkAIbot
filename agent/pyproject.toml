[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "clerk-agent"
version = "0.1.0"
description = "Copper Hills Stake Clerk Assistant on Bedrock AgentCore"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore >= 1.25, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "strands-agents >= 1.63.0, < 2.0.0",
]

[tool.agentcore]
entrypoint = "clerk_agent.py"

[tool.hatch.build.targets.wheel]
packages = ["."]
